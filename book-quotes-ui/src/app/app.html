      } @else {
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      }

          </a>

        <li class="nav-item">
          <a

        <a
          class="btn btn-outline-primary"
          routerLink="/login"
          (click)="closeMenu()"
        >
          <i class="fa-solid fa-right-to-bracket me-1" aria-hidden="true"></i>
